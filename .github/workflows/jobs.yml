name: Jobs

on:
  schedule:
    - cron: '17 09 * * *'  # ingest: daily 09:17 UTC
    - cron: '17 15 * * *'  # odds: daily 15:17 UTC
    - cron: '*/15 12-23,0-8 * * 0,6'  # lifecycle: every 15 min Sat 12:00–Sun 08:59 UTC
    - cron: '0 */3 * * 1-5'  # lifecycle: every 3 h Mon–Fri UTC
  workflow_dispatch:
    inputs:
      job:
        description: Job to run
        required: true
        default: all
        type: choice
        options:
          - ingest
          - odds
          - lifecycle
          - all

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    concurrency: jobs
    timeout-minutes: 10
    # The service account is the Admin SDK key: it bypasses firestore.rules entirely. Scoped to
    # the three steps that need it rather than the whole workflow, so `npm ci` (and any install
    # script in the dependency tree) never sees it.
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Determine job(s) to run
        id: jobs
        # Inputs go through env, not `${{ }}` inside the script, so nothing from the event can be
        # interpolated into the shell (the dispatch input is a fixed `choice`, but the pattern is
        # the one to copy).
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_JOB: ${{ github.event.inputs.job }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            JOB="$INPUT_JOB"
          else
            case "$SCHEDULE" in
              "17 09 * * *") JOB="ingest" ;;
              "17 15 * * *") JOB="odds" ;;
              "*/15 12-23,0-8 * * 0,6" | "0 */3 * * 1-5") JOB="lifecycle" ;;
              *) JOB="all" ;;
            esac
          fi
          echo "job=$JOB" >> $GITHUB_OUTPUT
      - name: Run ingest
        if: steps.jobs.outputs.job == 'ingest' || steps.jobs.outputs.job == 'all'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npm run job -- jobs/ingest-events.ts --live
      - name: Run odds
        if: steps.jobs.outputs.job == 'odds' || steps.jobs.outputs.job == 'all'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: npm run job -- jobs/ingest-odds.ts --live
      - name: Run lifecycle
        if: steps.jobs.outputs.job == 'lifecycle' || steps.jobs.outputs.job == 'all'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npm run job -- jobs/lifecycle.ts --live
